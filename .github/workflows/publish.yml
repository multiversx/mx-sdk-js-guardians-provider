name: Publish sdk-guardians-provider

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        run: npm install -g pnpm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get package version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npmjs next version
        if: ${{ steps.package.outputs.is-prerelease == 'true' }}
        run: npm publish --tag next

      - name: Publish to npmjs
        if: ${{ steps.package.outputs.is-prerelease == 'false' }}
        run: npm publish --access=public

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.package.outputs.version }}
        run: gh release create "$RELEASE_TAG" --target="$GITHUB_SHA" --title="$RELEASE_TAG" --generate-notes
